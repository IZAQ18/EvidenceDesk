services:
  - type: web
    name: evidencedesk-pilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: EVIDENCEDESK_ENV
        value: production
      - key: EVIDENCEDESK_AUTH_MODE
        value: api_key
      - key: EVIDENCEDESK_PILOT_ACCESS_CODE
        sync: false
      - key: EVIDENCEDESK_PILOT_SESSION_HOURS
        value: "12"
      - key: EVIDENCEDESK_SEED_DEMO_CONTENT
        value: "true"
      - key: EVIDENCEDESK_MODEL_GATEWAY_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNTS_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_REGISTRATION_ENABLED
        value: "false"
      - key: EVIDENCEDESK_GOOGLE_OAUTH_ENABLED
        value: "false"
      - key: EVIDENCEDESK_GOOGLE_OAUTH_REGISTRATION_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_PASSWORD_RESET_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_INVITATIONS_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_EXPORT_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_DELETION_ENABLED
        value: "false"
      - key: EVIDENCEDESK_DB_PATH
        value: /tmp/evidencedesk/evidencedesk.db
      - key: EVIDENCEDESK_DOCUMENT_STORE_PATH
        value: /tmp/evidencedesk/originals
      - key: EVIDENCEDESK_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: EVIDENCEDESK_MAX_UPLOAD_BYTES
        # 15 MiB: enough for practical pilot PDFs without overwhelming the free worker.
        value: "15728640"
      - key: EVIDENCEDESK_MAX_PDF_PAGES
        value: "40"
      - key: EVIDENCEDESK_OCR_MAX_PAGES
        # Fail fast with guidance before OCR can starve a free web instance.
        value: "4"
      - key: EVIDENCEDESK_OCR_DPI
        value: "110"
      - key: EVIDENCEDESK_INGESTION_JOB_LEASE_SECONDS
        value: "120"
      - key: EVIDENCEDESK_INGESTION_PROCESS_ISOLATION_ENABLED
        value: "true"
      - key: EVIDENCEDESK_INGESTION_EXTRACTION_TIMEOUT_SECONDS
        value: "40"
      - key: EVIDENCEDESK_INGESTION_WORKER_MEMORY_MB
        value: "320"
      - key: EVIDENCEDESK_INGESTION_WORKER_CPU_SECONDS
        value: "35"
      - key: EVIDENCEDESK_INGESTION_WORKER_NICE_LEVEL
        value: "19"
      # This public synthetic pilot has no private ClamAV service. Do not call it malware-scanned.
      - key: EVIDENCEDESK_MALWARE_SCANNER_BACKEND
        value: disabled
      - key: EVIDENCEDESK_MALWARE_SCAN_REQUIRED
        value: "false"
      - key: EVIDENCEDESK_EXPOSE_API_DOCS
        value: "false"
      - key: EVIDENCEDESK_ALLOWED_HOSTS
        value: localhost,127.0.0.1,*.onrender.com
