services:
  - type: web
    name: evidencedesk-pilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: EVIDENCEDESK_ENV
        value: production
      - key: EVIDENCEDESK_AUTH_MODE
        value: api_key
      - key: EVIDENCEDESK_SEED_DEMO_CONTENT
        value: "false"
      - key: EVIDENCEDESK_MODEL_GATEWAY_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNTS_ENABLED
        value: "true"
      - key: EVIDENCEDESK_EPHEMERAL_ACCOUNT_TESTING_ENABLED
        # This keeps the current invite-only deployment honest and synthetic-only.
        # Never enable EVIDENCEDESK_PUBLIC_CUSTOMER_LAUNCH_ENABLED with this override.
        value: "true"
      - key: EVIDENCEDESK_PUBLIC_CUSTOMER_LAUNCH_ENABLED
        value: "false"
      - key: EVIDENCEDESK_EDGE_RATE_LIMITING_CONFIRMED
        value: "false"
      - key: EVIDENCEDESK_MONITORING_CONFIRMED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_REGISTRATION_ENABLED
        value: "false"
      - key: EVIDENCEDESK_GOOGLE_OAUTH_ENABLED
        value: "true"
      - key: EVIDENCEDESK_GOOGLE_OAUTH_REGISTRATION_ENABLED
        value: "true"
      - key: EVIDENCEDESK_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: EVIDENCEDESK_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: EVIDENCEDESK_PUBLIC_BASE_URL
        value: https://evidencedesk-e2zk.onrender.com
      - key: EVIDENCEDESK_ACCOUNT_EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_PASSWORD_RESET_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_INVITATIONS_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_EXPORT_ENABLED
        value: "false"
      - key: EVIDENCEDESK_ACCOUNT_DELETION_ENABLED
        value: "false"
      - key: EVIDENCEDESK_DATABASE_BACKEND
        value: postgres
      - key: EVIDENCEDESK_DATABASE_URL
        fromDatabase:
          name: evidencedesk-pilot-db
          property: connectionString
      # Render's internal connection stays on its private network. EvidenceDesk accepts
      # non-TLS database URLs only for an explicit, dotless Render dpg-* hostname.
      - key: EVIDENCEDESK_DATABASE_PRIVATE_NETWORK_VERIFIED
        value: "true"
      - key: EVIDENCEDESK_DOCUMENT_STORE_PATH
        value: /tmp/evidencedesk/originals
      - key: EVIDENCEDESK_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: EVIDENCEDESK_MAX_UPLOAD_BYTES
        # 15 MiB: enough for practical pilot PDFs without overwhelming the free worker.
        value: "15728640"
      - key: EVIDENCEDESK_MAX_PDF_PAGES
        value: "40"
      - key: EVIDENCEDESK_OCR_MAX_PAGES
        # Fail fast with guidance before OCR can starve a free web instance.
        value: "4"
      - key: EVIDENCEDESK_OCR_DPI
        value: "110"
      - key: EVIDENCEDESK_INGESTION_JOB_LEASE_SECONDS
        value: "120"
      - key: EVIDENCEDESK_INGESTION_PROCESS_ISOLATION_ENABLED
        value: "true"
      - key: EVIDENCEDESK_INGESTION_EXTRACTION_TIMEOUT_SECONDS
        value: "40"
      - key: EVIDENCEDESK_INGESTION_WORKER_MEMORY_MB
        value: "320"
      - key: EVIDENCEDESK_INGESTION_WORKER_CPU_SECONDS
        value: "35"
      - key: EVIDENCEDESK_INGESTION_WORKER_NICE_LEVEL
        value: "19"
      # This public synthetic pilot has no private ClamAV service. Do not call it malware-scanned.
      - key: EVIDENCEDESK_MALWARE_SCANNER_BACKEND
        value: disabled
      - key: EVIDENCEDESK_MALWARE_SCAN_REQUIRED
        value: "false"
      - key: EVIDENCEDESK_EXPOSE_API_DOCS
        value: "false"
      - key: EVIDENCEDESK_ALLOWED_HOSTS
        value: localhost,127.0.0.1,*.onrender.com

databases:
  - name: evidencedesk-pilot-db
    plan: free
    databaseName: evidencedesk
    user: evidencedesk
    # The application uses Render's private network; do not expose PostgreSQL publicly.
    ipAllowList: []
