name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidencedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evidencedesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVIDENCEDESK_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/evidencedesk_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pip-audit -r requirements.txt
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: evidencedesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
